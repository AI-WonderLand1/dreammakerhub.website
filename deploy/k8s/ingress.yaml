apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ide-ingress
  namespace: coder
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # Civo Kubernetes serves ONLY the Coder IDE.
  #   - Main website (dreammakerhub.website / www / ai.) -> AWS EC2  (deploy/deploy.sh)
  #   - 3D engine (play. / wonderplay. / playcanvas.)    -> LightningAI (proxied by AWS nginx)
  # See deploy/README.md for the full topology.
  tls:
  - hosts:
    - ide.dreammakerhub.website
    secretName: ide-tls
  rules:
  - host: ide.dreammakerhub.website
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: coder-ide
            port:
              number: 80
