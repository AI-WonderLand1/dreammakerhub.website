apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ide-ingress
  namespace: coder
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dreammakerhub.website
    - www.dreammakerhub.website
    secretName: wonder-web-tls
  rules:
  - host: ide.dreammakerhub.website
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: coder-ide
            port:
              number: 80
  - host: playcanvas.dreammakerhub.website
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: playcanvas-webgl
            port:
              number: 80

  - host: dreammakerhub.website
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wonder-web
            port:
              number: 80
  - host: www.dreammakerhub.website
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wonder-web
            port:
              number: 80