apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonderland-ide
  namespace: wonderland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wonderland-ide
  template:
    metadata:
      labels:
        app: wonderland-ide
    spec:
      containers:
        - name: ide
          image: wonderspace/ide:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: WS_DIR
              value: "/home/coder/project"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: ide-data
              mountPath: /home/coder/project
      volumes:
        - name: ide-data
          persistentVolumeClaim:
            claimName: wonderland-ide-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wonderland-ide-pvc
  namespace: wonderland
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wonderland-ide
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: wonderland-ide