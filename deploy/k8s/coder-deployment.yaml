apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coder
  template:
    metadata:
      labels:
        app: coder
    spec:
      serviceAccountName: coder-workspace-provisioner
      containers:
      - name: coder
        image: ghcr.io/coder/coder:v2.32.0
        ports:
        - containerPort: 7080
          name: http
        env:
        - name: CODER_HTTP_ADDRESS
          value: "0.0.0.0:7080"
        - name: CODER_ACCESS_URL
          valueFrom:
            configMapKeyRef:
              name: coder-config
              key: CODER_ACCESS_URL
        - name: CODER_WILDCARD_ACCESS_URL
          valueFrom:
            configMapKeyRef:
              name: coder-config
              key: CODER_WILDCARD_ACCESS_URL
        - name: CODER_DERP_FORCE_WEBSOCKETS
          valueFrom:
            configMapKeyRef:
              name: coder-config
              key: CODER_DERP_FORCE_WEBSOCKETS
        - name: CODER_SESSION_HOST_PREFIX_COOKIES
          valueFrom:
            configMapKeyRef:
              name: coder-config
              key: CODER_SESSION_HOST_PREFIX_COOKIES
        - name: CODER_REDIRECT_TO_ACCESS_URL
          value: "true"
        - name: CODER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: coder-env
              key: CODER_DB_PASSWORD
        - name: CODER_PG_CONNECTION_URL
          value: "postgres://coder:$(CODER_DB_PASSWORD)@coder-db:5432/coder?sslmode=disable"
        readinessProbe:
          httpGet:
            path: /api/v2/buildinfo
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/v2/buildinfo
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coder
  namespace: coder
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: coder
