apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: wonderland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coder
  template:
    metadata:
      labels:
        app: coder
    spec:
      containers:
      - name: coder
        image: ghcr.io/coder/coder:v2.32.0
        ports:
        - containerPort: 7080
        - containerPort: 8443
        env:
        - name: CODER_ACCESS_URL
          valueFrom:
            configMapKeyRef:
              name: coder-config
              key: CODER_ACCESS_URL
        - name: CODER_WILDCARD_ACCESS_URL
          valueFrom:
            configMapKeyRef:
              name: coder-config
              key: CODER_WILDCARD_ACCESS_URL
        - name: CODER_DERP_FORCE_WEBSOCKETS
          valueFrom:
            configMapKeyRef:
              name: coder-config
              key: CODER_DERP_FORCE_WEBSOCKETS
        - name: CODER_PG_CONNECTION_URL
          value: "postgres://coder:$(CODER_DB_PASSWORD)@coder-db:5432/coder?sslmode=disable"
        - name: CODER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: coder-env
              key: CODER_DB_PASSWORD
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coder
  namespace: wonderland
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 7080
  - port: 443
    targetPort: 8443
  selector:
    app: coder
