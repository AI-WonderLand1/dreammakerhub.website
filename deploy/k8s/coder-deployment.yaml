apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: wonderland
  labels:
    app: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coder
  template:
    metadata:
      labels:
        app: coder
    spec:
      containers:
        - name: coder
          image: coder/coder:v2.31.7
          command: ["coder", "server"]
          env:
            - name: CODER_ACCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: wonderland-config
                  key: CODER_ACCESS_URL
            - name: CODER_WILDCARD_ACCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: wonderland-config
                  key: CODER_WILDCARD_ACCESS_URL
            - name: CODER_HTTP_ADDRESS
              value: "0.0.0.0:7080"
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: coder-db-url
                  key: url
          ports:
            - containerPort: 7080
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/buildinfo
              port: 7080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/buildinfo
              port: 7080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: coder-data
              mountPath: /home/coder
      volumes:
        - name: coder-data
          persistentVolumeClaim:
            claimName: coder-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coder-data-pvc
  namespace: wonderland
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coder
  namespace: wonderland
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 7080
      name: http
  selector:
    app: coder