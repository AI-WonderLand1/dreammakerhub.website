apiVersion: apps/v1
kind: Deployment
metadata:
  name: playcanvas-webgl
  namespace: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playcanvas-webgl
  template:
    metadata:
      labels:
        app: playcanvas-webgl
    spec:
      containers:
      - name: playcanvas
        image: playcanvas/engine:2.0.0
        ports:
        - containerPort: 31000
          name: editor
        - containerPort: 31001
          name: api
        - containerPort: 31002
          name: ammo
        env:
        - name: PLAYCANVAS_PORT
          value: "31000"
        - name: WEBGL_ENABLED
          value: "true"
        - name: ISOLATION_MODE
          value: "service-worker"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4
            memory: 8Gi
        volumeMounts:
        - name: scenes
          mountPath: /app/scenes
      - name: webgl-studio
        image: iad.ocir.io/axgejcaos4uw/wonderspace/webgl-studio:latest
        ports:
        - containerPort: 8080
          name: webgl-http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
        - name: shaders
          mountPath: /app/shaders
      volumes:
      - name: scenes
        persistentVolumeClaim:
          claimName: playcanvas-scenes-pvc
      - name: shaders
        persistentVolumeClaim:
          claimName: webgl-shaders-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: playcanvas-scenes-pvc
  namespace: coder
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webgl-shaders-pvc
  namespace: coder
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: playcanvas-webgl
  namespace: coder
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 31000
    name: editor
  - port: 8080
    targetPort: 8080
    name: webgl
  selector:
    app: playcanvas-webgl