apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonder-web
  namespace: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wonder-web
  template:
    metadata:
      labels:
        app: wonder-web
    spec:
      containers:
      - name: web
        image: iad.ocir.io/axgejcaos4uw/wonderspace/web:latest
        ports:
        - containerPort: 5000
        env:
        - name: NEXT_PUBLIC_SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: coder-env
              key: SUPABASE_URL
        - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: coder-env
              key: SUPABASE_ANON_KEY
        - name: NEXT_PUBLIC_URL
          value: "https://www.dreammakerhub.website"
