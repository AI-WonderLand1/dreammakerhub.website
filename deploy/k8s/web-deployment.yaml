apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreammaker-web
  namespace: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dreammaker-web
  template:
    metadata:
      labels:
        app: dreammaker-web
    spec:
      containers:
      - name: web
        image: node:22-alpine
        command: ["sh", "-c"]
        args:
        - |
          cd /data/apps/web &&
          exec node node_modules/.bin/next start -p 5000 -H 0.0.0.0
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dreammaker-web-data

---
apiVersion: v1
kind: Service
metadata:
  name: dreammaker-web
  namespace: coder
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: dreammaker-web

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dreammaker-web
  namespace: coder
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-dns"
  ingressClassName: traefik
spec:
  tls:
  - hosts:
    - dreammakerhub.website
    - www.dreammakerhub.website
    secretName: dreammaker-web-tls
  rules:
  - host: dreammakerhub.website
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: dreammaker-web
            port:
              number: 80
  - host: www.dreammakerhub.website
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: dreammaker-web
            port:
              number: 80
