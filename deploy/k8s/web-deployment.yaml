apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreammaker-web
  namespace: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dreammaker-web
  template:
    metadata:
      labels:
        app: dreammaker-web
    spec:
      containers:
      - name: web
        image: ghcr.io/ai-wonderland1/dreammakerhub-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_URL
          value: "https://dreammakerhub.website"
        envFrom:
        - secretRef:
            name: dreammaker-web-env
            optional: true
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: dreammaker-web
  namespace: coder
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: dreammaker-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dreammaker-web
  namespace: coder
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dreammakerhub.website
    - www.dreammakerhub.website
    secretName: dreammaker-web-tls
  rules:
  - host: dreammakerhub.website
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: dreammaker-web
            port:
              number: 80
  - host: www.dreammakerhub.website
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: dreammaker-web
            port:
              number: 80
