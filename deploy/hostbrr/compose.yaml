# HostBrr 8 GiB VPS: PRIVATE web staging only. No public ingress by default.
# Manual only; use a built immutable SHA rather than the mutable :latest tag.
name: ai-wonderland-hostbrr
services:
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE in deployment.env to a verified GHCR SHA tag}
    init: true
    restart: unless-stopped
    env_file:
      - ./runtime.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      NODE_OPTIONS: "--max-http-header-size=32768"
      # Hard-disable cost-bearing operations until audited and explicitly enabled in
      # a separate approved change. A web deploy does NOT provision Coder or GPU.
      BILLABLE_OPERATIONS_ENABLED: "false"
      CODER_WORKSPACE_CREATION_ENABLED: "false"
      CODER_CUSTOMER_PROVISIONING_ENABLED: "false"
      FREE_BUILDER_AI_ENABLED: "false"
    ports:
      # NOT public. Keep the VM firewall closed to 5000/5001.
      - "127.0.0.1:5001:5000"
    mem_limit: 5g
    cpus: 3.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
