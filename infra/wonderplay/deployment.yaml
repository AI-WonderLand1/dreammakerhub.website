apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonderplay
  namespace: WonderPlay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wonderplay
  template:
    metadata:
      labels:
        app: wonderplay
    spec:
      nodeSelector:
        node-pool: cluster1
      containers:
        - name: wonderplay
          image: ord.ocir.io/axgejcaos4uw/ai-wonderland/wonder-runtime:latest
          ports:
            - containerPort: 3090
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3090
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3090
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: oci-registry-secret