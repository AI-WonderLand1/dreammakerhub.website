apiVersion: v1
kind: Pod
metadata:
  name: ide-sandbox-template
  labels:
    app: wonder-ide
    engine: coder
spec:
  containers:
    - name: ide-container
      image: codercom/code-server:latest
      args: ["--auth", "none", "--disable-telemetry"]
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: workspace-storage
          mountPath: /home/coder/project
  volumes:
    - name: workspace-storage
      emptyDir: {}