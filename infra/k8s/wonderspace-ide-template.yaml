apiVersion: v1
kind: Namespace
metadata:
  name: wonderspace-ide
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wonderspace-ide-{{WORKSPACE_ID}}
  namespace: wonderspace-ide
  labels:
    app: wonderspace-ide
    workspace: "{{WORKSPACE_ID}}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wonderspace-ide
      workspace: "{{WORKSPACE_ID}}"
  template:
    metadata:
      labels:
        app: wonderspace-ide
        workspace: "{{WORKSPACE_ID}}"
    spec:
      containers:
        - name: theia
          image: {{IMAGE}}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: IDE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wonderspace-ide-{{WORKSPACE_ID}}-secret
                  key: ide_access_token
            - name: WORKSPACE_ID
              value: "{{WORKSPACE_ID}}"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: workspace-data
              mountPath: /home/theia/workspaces
            - name: theia-config
              mountPath: /home/theia/.theia
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: wonderspace-workspace-{{WORKSPACE_ID}}
        - name: theia-config
          persistentVolumeClaim:
            claimName: wonderspace-config-{{WORKSPACE_ID}}
---
apiVersion: v1
kind: Service
metadata:
  name: wonderspace-ide-{{WORKSPACE_ID}}
  namespace: wonderspace-ide
spec:
  selector:
    app: wonderspace-ide
    workspace: "{{WORKSPACE_ID}}"
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wonderspace-ide-{{WORKSPACE_ID}}
  namespace: wonderspace-ide
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{WORKSPACE_ID}}.ide.example.com
      secretName: wonderspace-ide-tls
  rules:
    - host: {{WORKSPACE_ID}}.ide.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wonderspace-ide-{{WORKSPACE_ID}}
                port:
                  number: 80
