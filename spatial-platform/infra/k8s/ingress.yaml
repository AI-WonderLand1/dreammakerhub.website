apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spatial-platform
  namespace: spatial-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
spec:
  ingressClassName: nginx
  rules:
    - host: spatial.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
