name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: spatial-platform
          file: spatial-platform/infra/docker/api.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/spatial-api:latest

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: spatial-platform
          file: spatial-platform/infra/docker/web.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/spatial-web:latest

      - name: Deploy to Kubernetes
        uses: steebchen/kubectl@v2
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: set image deployment/api api=${{ secrets.DOCKER_USERNAME }}/spatial-api:latest -n spatial-platform

      - name: Deploy Web
        uses: steebchen/kubectl@v2
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: set image deployment/web web=${{ secrets.DOCKER_USERNAME }}/spatial-web:latest -n spatial-platform
