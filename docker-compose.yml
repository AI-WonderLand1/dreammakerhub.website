version: "3.8"

services:
  wonderspace:
    build:
      context: ..
      dockerfile: Docker-image/Dockerfile
    container_name: wonderspace
    ports:
      - "7080:7080"
      - "80:80"
      - "443:443"
      - "8888:8888"  # Billing API
    volumes:
      - wonderspace-db:/var/lib/postgresql/data
      - wonderspace-caddy:/root/.local/share/caddy
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CODER_ACCESS_URL=${CODER_ACCESS_URL:-http://localhost:7080}
      - CODER_WILDCARD_ACCESS_URL=${CODER_WILDCARD_ACCESS_URL:-}
      - ENABLE_TLS=${ENABLE_TLS:-false}
      - DOMAIN=${DOMAIN:-}
      # YOUR OpenCode API key - HIDDEN from users, never expose this
      # You pay OpenCode with this key
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      # Your branded API key - this is what you give to users
      # Auto-generated if not set, or set your own
      - WONDERSPACE_API_KEY=${WONDERSPACE_API_KEY:-}
    restart: unless-stopped

volumes:
  wonderspace-db:
  wonderspace-caddy: