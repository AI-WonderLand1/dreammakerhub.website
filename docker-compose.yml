version: "3.8"

services:
  ide:
    build:
      context: .
      dockerfile: kubernetes-devcontainer/.devcontainer/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ide-data:/home/coder/project
    environment:
      - PORT=8080
      - WS_DIR=/home/coder/project
    restart: unless-stopped

volumes:
  ide-data: