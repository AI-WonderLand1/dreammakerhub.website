name: Build & Push WonderSpace IDE Image

on:
  workflow_dispatch:
  push:
    branches:
      - Master
    paths:
      - "infra/coder/Dockerfile.workspace"
      - "infra/coder/template/**"
      - ".github/workflows/ide-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push WonderSpace IDE image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/coder/Dockerfile.workspace
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/AI-WonderLand1/dreammakerhub.website
            org.opencontainers.image.title=WonderSpace IDE Workspace
          tags: |
            ghcr.io/ai-wonderland1/wonderspace-ide:latest
            ghcr.io/ai-wonderland1/wonderspace-ide:${{ github.sha }}
