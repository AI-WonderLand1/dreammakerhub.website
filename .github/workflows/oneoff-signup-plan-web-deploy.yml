name: One-off signup plan web deploy

on:
  push:
    branches:
      - ops/deploy-signup-plan-web-20260918
    paths:
      - .github/workflows/oneoff-signup-plan-web-deploy.yml

permissions:
  contents: read

concurrency:
  group: deploy-upcloud-production
  cancel-in-progress: false

jobs:
  deploy-web-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UPCLOUD_SERVER_IP: ${{ vars.UPCLOUD_SERVER_IP || '152.44.43.125' }}
      UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || 'root' }}
      SSH_PRIVATE_KEY: ${{ secrets.UPCLOUD_SSH_KEY || secrets.UPLOAD_SSH_KEY }}
    steps:
      - name: Deploy pinned web image without touching Coder, database, or existing environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'UpCloud SSH key unavailable; nothing deployed.'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=12 "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" 'sudo -n bash -s' <<'REMOTE'
            set -euo pipefail
            app_dir=/opt/dreammakerhub.website
            compose=deploy/upcloud/docker-compose.yml
            revision=445871ec5c9c890c54eb98722658fd7b2848c3a4
            image="ghcr.io/ai-wonderland1/dreammakerhub-website:$revision"
            rollback_image=ghcr.io/ai-wonderland1/dreammakerhub-website:rollback-before-signup-plan

            test -f "$app_dir/.env" && test -f "$app_dir/$compose" || {
              echo 'Existing web configuration missing; no changes made.'; exit 1;
            }
            cd "$app_dir"
            test "$(docker inspect --format '{{.State.Running}}' dreammaker-web 2>/dev/null || true)" = true || {
              echo 'Existing web container is not running; no changes made.'; exit 1;
            }
            old_id="$(docker inspect --format '{{.Image}}' dreammaker-web)"
            test -n "$old_id"

            # Pull and verify this exact merge commit before touching any service.
            docker pull "$image"
            actual="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            test "$actual" = "$revision" || {
              echo 'Pinned image revision mismatch; no changes made.'; exit 1;
            }
            new_id="$(docker image inspect --format '{{.Id}}' "$image")"
            if [ "$old_id" = "$new_id" ]; then
              echo 'Pinned signup-plan image is already running.'
              exit 0
            fi
            docker tag "$old_id" "$rollback_image"

            override="$(mktemp --suffix=.yml)"
            changed=0
            rollback_on_failure() {
              status=$?
              if [ "$status" -ne 0 ] && [ "$changed" -eq 1 ]; then
                echo 'Web-only deploy failed; attempting rollback of web image.'
                printf 'services:\n  web:\n    image: %s\n' "$rollback_image" > "$override"
                docker compose --env-file .env -f "$compose" -f "$override" up -d --no-deps --force-recreate --pull never web || true
                if docker exec dreammaker-web sh -c 'curl -fsS http://127.0.0.1:5000/health >/dev/null' 2>/dev/null; then
                  echo 'Previous web image restored and healthy.'
                else
                  echo 'Web rollback health could not be confirmed; investigate host.'
                fi
              fi
              rm -f "$override"
            }
            trap rollback_on_failure EXIT

            printf 'services:\n  web:\n    image: %s\n' "$image" > "$override"
            docker compose --env-file .env -f "$compose" -f "$override" config --quiet
            changed=1
            docker compose --env-file .env -f "$compose" -f "$override" up -d --no-deps --force-recreate --pull never web

            ready=0
            for attempt in $(seq 1 30); do
              if docker exec dreammaker-web sh -c 'curl -fsS http://127.0.0.1:5000/health >/dev/null' 2>/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1 || { echo 'New web image failed health check.'; exit 1; }

            # Public route checks only. A real signup/confirmation requires a user session.
            docker exec dreammaker-web sh -c 'curl -fsS http://127.0.0.1:5000/subscription >/dev/null'
            docker exec dreammaker-web sh -c 'curl -fsS "http://127.0.0.1:5000/public-pages/auth?signup=true" >/dev/null'
            echo 'Pinned signup-plan web image healthy, public auth and subscription routes respond. Other services untouched.'
          REMOTE
