name: "CodeQL Remediation Queue"

on:
  workflow_run:
    workflows: ["CodeQL Advanced"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    name: Queue open CodeQL findings
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch open CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" > findings.json
          count="$(jq 'length' findings.json)"
          echo "Open CodeQL alerts: ${count}"
          {
            echo "## CodeQL remediation queue"
            echo
            echo "Open alerts: **${count}**"
            echo
            jq -r '.[] | "- #\(.number) **\(.rule.description // .rule.name // .rule.id)** — `\(.most_recent_instance.location.path // "unknown"):\(.most_recent_instance.location.start_line // 0)` (\(.rule.security_severity_level // .rule.severity // "unknown"))"' findings.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | ["CODEQL_ALERT", (.number|tostring), (.rule.id // "unknown"), (.rule.security_severity_level // .rule.severity // "unknown"), (.most_recent_instance.location.path // "unknown"), ((.most_recent_instance.location.start_line // 0)|tostring), (.rule.description // .rule.name // "unknown")] | join("|")' findings.json

      - name: Upload remediation queue
        uses: actions/upload-artifact@v4
        with:
          name: codeql-remediation-queue
          path: findings.json
          retention-days: 14
