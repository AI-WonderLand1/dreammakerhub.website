name: "AI Predictive Remediation"

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]

jobs:
  predict-and-suggest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - run: node .github/scripts/predict-risk.mjs
      - name: Suggest fixes for risky files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/suggest-fixes.mjs
      - name: Post PR comment
        if: success()
        run: |
          if [ -f risk-comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file risk-comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  remediate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: read
    steps:
- uses: actions/checkout@v7
          with:
            ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: git checkout -b auto-remediate-${{ github.run_id }}
      - name: Fetch CodeQL findings
        run: |
          gh api repos/${{ github.repository }}/code-scanning/alerts \
            --jq '[.[] | select(.state=="open")]' > findings.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate patch (no auto-apply)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/ai-remediate.mjs --dry-run
      - name: Open PR with proposed fix for human review
        if: success() && test -f proposed-fix.patch
        run: |
          git config --global user.name "AI-Wonderland-Agent"
          git config --global user.email "agent@ai-wonderland.com"
          git apply proposed-fix.patch || true
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "security: proposed fix for CodeQL finding (needs review)"
          git push origin auto-remediate-${{ github.run_id }}
          gh pr create --base main --head auto-remediate-${{ github.run_id }} \
            --title "Proposed security fix ($(date +%F)) [REVIEW REQUIRED]" \
            --body "Automated patch generated by AI. Requires human review before merge."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
