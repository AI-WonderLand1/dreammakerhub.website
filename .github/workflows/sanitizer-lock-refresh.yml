name: Refresh sanitizer lockfile

on:
  push:
    branches:
      - fix/codeql-first-party-high-2026-09-01
    paths:
      - ".github/workflows/sanitizer-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codeql-first-party-high-2026-09-01
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify sanitizer dependency tree
        run: |
          node <<'NODE'
          const fs = require("fs");
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const jsdom = lock.packages["node_modules/jsdom"];
          const purify = lock.packages["node_modules/dompurify"];
          if (jsdom?.version !== "29.1.1" || jsdom?.dev) {
            throw new Error(`Expected production jsdom 29.1.1, got ${JSON.stringify(jsdom)}`);
          }
          if (purify?.version !== "3.4.14") {
            throw new Error(`Expected DOMPurify 3.4.14, got ${JSON.stringify(purify)}`);
          }
          console.log({ jsdom: jsdom.version, dompurify: purify.version });
          NODE
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "security: refresh sanitizer lockfile [skip ci]"
          git push origin HEAD:fix/codeql-first-party-high-2026-09-01
