name: Atomic AI metering SQL verification
on:
  pull_request:
    branches: [Master]
    paths:
      - 'supabase/migrations/202609201800_atomic_billable_usage.sql'
      - '.github/scripts/verify-atomic-billable-usage.sql'
      - '.github/workflows/atomic-billable-usage-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d launch_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check migration on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --version
          psql -h 127.0.0.1 -U postgres -d launch_test \
            -v ON_ERROR_STOP=1 -f .github/scripts/verify-atomic-billable-usage.sql
