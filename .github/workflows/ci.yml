name: CI

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # No GitHub production secrets, even for same-repo pull requests.
    env:
      ALICE_API_KEY: ci-build-placeholder
      SIMPLE_RICK_API_KEY: ci-build-placeholder
      SPIRIT_GUIDE_API_KEY: ci-build-placeholder
      MONGODB_URI: mongodb://127.0.0.1:27017/ci-build
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build web app without production credentials
        run: npm run build --workspace=apps/web
      - name: Run tests
        run: npm test
