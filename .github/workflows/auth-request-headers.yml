name: Harden Auth Request Headers

on:
  push:
    branches: [Master]
    paths:
      - deploy/upcloud/docker-compose.yml
      - deploy/upcloud/nginx-dreammakerhub.conf
      - .github/workflows/auth-request-headers.yml
  workflow_run:
    workflows: [Deploy Main Site to UpCloud VM]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upcloud-auth-request-headers
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'Master')
    runs-on: ubuntu-latest
    env:
      UPCLOUD_SERVER_IP: ${{ vars.UPCLOUD_SERVER_IP || '152.44.43.125' }}
      UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || 'root' }}
      SSH_PRIVATE_KEY: ${{ secrets.UPCLOUD_SSH_KEY || secrets.UPLOAD_SSH_KEY }}
    steps:
      - name: Configure request headers on active host Nginx
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing UpCloud SSH key'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" 'sudo -n bash -s' <<'REMOTE'
            set -euo pipefail
            if ! command -v nginx >/dev/null 2>&1 || ! systemctl is-active --quiet nginx; then
              echo 'Host Nginx is not active. Docker Nginx must use the updated conf.d mount and be recreated during deployment.'
              exit 1
            fi

            config=/etc/nginx/conf.d/dreammakerhub-auth-request-headers.conf
            backup="$(mktemp)"
            had_previous=0
            if [ -f "$config" ]; then
              cp "$config" "$backup"
              had_previous=1
            fi

            # Incoming requests need separate header limits from proxy response
            # buffers. Keep a finite cap for Supabase SSR cookie chunks.
            cat > "$config" <<'NGINX'
client_header_buffer_size 8k;
large_client_header_buffers 4 32k;
NGINX
            if nginx -t; then
              systemctl reload nginx
              rm -f "$backup"
              echo 'Active host Nginx accepted bounded auth request headers.'
            else
              if [ "$had_previous" -eq 1 ]; then
                cp "$backup" "$config"
              else
                rm -f "$config"
              fi
              rm -f "$backup"
              nginx -t || true
              exit 1
            fi
          REMOTE

      - name: Confirm a synthetic cookie is accepted
        shell: bash
        run: |
          set -euo pipefail
          printf -v padding '%*s' 12000 ''
          padding="${padding// /x}"
          status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' --cookie "dmh_header_probe=$padding" https://dreammakerhub.website/favicon.ico)"
          case "$status" in
            200|301|302|303|307|308) echo 'Synthetic 12 KiB cookie request passed.' ;;
            *) echo "Synthetic cookie request failed with HTTP $status. Check active proxy and Next.js header limits."; exit 1 ;;
          esac
