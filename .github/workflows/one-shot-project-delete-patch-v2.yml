name: One-shot typed-name deletion wiring v2

on:
  push:
    branches: [fix/typed-name-project-deletion]
    paths: ['.github/workflows/one-shot-project-delete-patch-v2.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typed-name-project-deletion
          persist-credentials: true
      - name: Apply guarded deletion to existing pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new):
              count = text.count(old)
              if count != 1: raise RuntimeError(f'Expected one match, got {count}: {old[:95]!r}')
              return text.replace(old, new, 1)

          def save(path, change):
              p = Path(path)
              before = p.read_text()
              after = change(before)
              if after == before: raise RuntimeError(f'No change in {path}')
              p.write_text(after)
              print('Patched', path)

          def storage(text):
              start = text.index('export async function deleteProject(')
              end = text.index('\nexport async function createRevision(', start)
              replacement = '''export async function deleteProject(projectId: string, ownerId: string, confirmationName: string): Promise<void> {
            const project = await assertOwner(projectId, ownerId);
            if (confirmationName !== project.name) throw new Error("Project name changed during deletion.");
            const supabase = await getClient();
            // Name check in the query prevents a concurrent rename from bypassing confirmation.
            const { data, error } = await supabase.from("_projects")
              .delete()
              .eq("id", projectId)
              .eq("owner_id", ownerId)
              .eq("name", confirmationName)
              .select("id");
            if (error) throw new Error(error.message);
            if (!data?.length) throw new Error("Project name changed during deletion.");
          }
          '''
              return text[:start] + replacement + text[end:]

          def project_page(text):
              text = once(text, '  Trash2,\n', '')
              text = once(text, 'import RepositoryFileBrowser from "./RepositoryFileBrowser";', 'import RepositoryFileBrowser from "./RepositoryFileBrowser";\nimport ProjectDeleteButton from "@/app/(workspace)/dashboard/components/ProjectDeleteButton";')
              text = once(text, '  const [deleting, setDeleting] = useState(false);\n', '')
              start = text.index('  async function deleteProject() {')
              end = text.index('  function downloadZip() {', start)
              text = text[:start] + text[end:]
              marker = text.index('onClick={() => void deleteProject()}')
              start = text.rfind('<button', 0, marker)
              end = text.index('</button>', marker) + len('</button>')
              indent = text[text.rfind('\n', 0, start) + 1:start]
              element = '\n'.join(indent + line for line in [
                  '<ProjectDeleteButton',
                  '  project={project}',
                  '  onDeleted={() => { router.replace("/dashboard#projects"); router.refresh(); }}',
                  '  className="flex w-full items-center gap-2 rounded-lg border border-red-500/30 px-3 py-2.5 text-sm text-red-300 hover:bg-red-500/10"',
                  '/>',
              ])
              return text[:start] + element.lstrip() + text[end:]

          def dashboard(text):
              text = once(text, 'import { createClient } from "@/lib/supabase/client";', 'import { createClient } from "@/lib/supabase/client";\nimport ProjectDeleteButton from "./components/ProjectDeleteButton";')
              marker = text.index('<Link href={toolAction.href}')
              end = text.index('</div>', marker) + len('</div>')
              addition = '''
                        <div className="mt-2 flex justify-end">
                          <ProjectDeleteButton
                            project={project}
                            onDeleted={() => setProjects((current) => current.filter((entry) => entry.id !== project.id))}
                            className="inline-flex items-center gap-1 rounded-md border border-red-500/25 px-2 py-1.5 text-[11px] text-red-300 hover:bg-red-500/10"
                            label="Delete"
                          />
                        </div>'''
              return text[:end] + addition + text[end:]

          def dialog(text):
              text = once(text, "import { useId, useState } from 'react';", "import { useId, useState } from 'react';\nimport { createPortal } from 'react-dom';")
              text = once(text, '      {open && (\n', "      {open && typeof document !== 'undefined' && createPortal(\n")
              text = once(text, '        </div>\n      )}\n', '        </div>, document.body\n      )}\n')
              return text

          save('apps/web/lib/projects/storage.ts', storage)
          save('apps/web/app/(workspace)/dashboard/projects/[id]/page.tsx', project_page)
          save('apps/web/app/(workspace)/dashboard/page.tsx', dashboard)
          save('apps/web/app/(workspace)/dashboard/components/ProjectDeleteButton.tsx', dialog)
          PY
          git rm .github/workflows/one-shot-project-delete-patch.yml .github/workflows/one-shot-project-delete-patch-v2.yml
          git add apps/web/lib/projects/storage.ts 'apps/web/app/(workspace)/dashboard/projects/[id]/page.tsx' 'apps/web/app/(workspace)/dashboard/page.tsx' 'apps/web/app/(workspace)/dashboard/components/ProjectDeleteButton.tsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire typed-name delete dialog into project UI and storage'
          git push origin HEAD:fix/typed-name-project-deletion
