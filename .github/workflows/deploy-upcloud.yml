name: Deploy Main Site to UpCloud VM

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build & Push Web Image
    types:
      - completed

permissions:
  contents: read
  packages: read

env:
  UPCLOUD_SERVER_IP: ${{ vars.UPCLOUD_SERVER_IP || '152.44.43.125' }}
  UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || 'root' }}
  SSH_PRIVATE_KEY: ${{ secrets.UPCLOUD_SSH_KEY || secrets.UPLOAD_SSH_KEY }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'Master')
    runs-on: ubuntu-latest
    name: Deploy DreamMakerHub web to UpCloud VM

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7
        with:
          ref: Master

      - name: Validate deployment configuration
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$UPCLOUD_SERVER_IP" || { echo "Missing UpCloud server IP"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing GitHub Actions SSH secret: set UPCLOUD_SSH_KEY (preferred) or legacy UPLOAD_SSH_KEY"; exit 1; }

          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL NEXTAUTH_SECRET; do
            if [ -z "${!name:-}" ]; then
              if [ "$name" = "NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
                echo "Missing Supabase publishable key. Set either NEXT_PUBLIC_SUPABASE_ANON_KEY or NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY and grant this repository access."
              else
                echo "Missing Actions secret $name. If it is an organization secret, grant AI-WonderLand1/dreammakerhub.website access to it."
              fi
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          case "$NEXT_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "NEXT_PUBLIC_SUPABASE_URL does not look like a Supabase project URL."; exit 1 ;;
          esac

          echo "Deploy target: ${UPCLOUD_SSH_USER}@${UPCLOUD_SERVER_IP}"
          echo "Required production secrets are available to this repository."

      - name: Prepare production environment bundle
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CODER_API_TOKEN: ${{ secrets.CODER_API_TOKEN }}
          CODER_API_URL: ${{ secrets.CODER_API_URL }}
          NEXT_PUBLIC_WEBCONTAINER_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_WEBCONTAINER_CLIENT_ID }}
          NEXT_PUBLIC_WORKSPACE_DOMAIN: ${{ secrets.NEXT_PUBLIC_WORKSPACE_DOMAIN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OCI_VAULT_OCID: ${{ secrets.OCI_VAULT_OCID }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          NEXT_PUBLIC_GOOGLE_AI_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_MODELS_API_KEY: ${{ secrets.GITHUB_MODELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALICE_API_KEY: ${{ secrets.ALICE_API_KEY }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
          EXTENSION_ENCRYPTION_KEY: ${{ secrets.EXTENSION_ENCRYPTION_KEY }}
          SECRETS_ENCRYPTION_KEY: ${{ secrets.SECRETS_ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO_ID: ${{ secrets.STRIPE_PRICE_PRO_ID }}
          STRIPE_PRICE_PRO_YEARLY_ID: ${{ secrets.STRIPE_PRICE_PRO_YEARLY_ID }}
          STRIPE_PRICE_TEAM_ID: ${{ secrets.STRIPE_PRICE_TEAM_ID }}
          STRIPE_PRICE_TEAM_YEARLY_ID: ${{ secrets.STRIPE_PRICE_TEAM_YEARLY_ID }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          SPLAT_TRAINING_WEBHOOK: ${{ secrets.SPLAT_TRAINING_WEBHOOK }}
          SPLAT_CALLBACK_SECRET: ${{ secrets.SPLAT_CALLBACK_SECRET }}
          SIMPLE_RICK_API_KEY: ${{ secrets.SIMPLE_RICK_API_KEY }}
          SPIRIT_GUIDE_API_KEY: ${{ secrets.SPIRIT_GUIDE_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail
          umask 077
          ENV_FILE="$RUNNER_TEMP/dreammakerhub.env"
          : > "$ENV_FILE"

          write_env() {
            local key="$1"
            local value="${2-}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Secret $key contains a newline and cannot be written safely to the Docker env file."
              exit 1
            fi
            printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
          }

          write_env NODE_ENV production
          write_env PORT 5000
          write_env NEXT_PUBLIC_URL https://dreammakerhub.website
          write_env NEXTAUTH_URL https://dreammakerhub.website
          write_env NEXT_PUBLIC_CODER_ACCESS_URL https://coder.dreammakerhub.website
          write_env DOMAIN dreammakerhub.website

          write_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          write_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          write_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          write_env DATABASE_URL "$DATABASE_URL"
          write_env NEXTAUTH_SECRET "$NEXTAUTH_SECRET"
          write_env CODER_API_TOKEN "$CODER_API_TOKEN"
          write_env CODER_API_URL "$CODER_API_URL"
          write_env NEXT_PUBLIC_WEBCONTAINER_CLIENT_ID "$NEXT_PUBLIC_WEBCONTAINER_CLIENT_ID"
          write_env NEXT_PUBLIC_WORKSPACE_DOMAIN "$NEXT_PUBLIC_WORKSPACE_DOMAIN"
          write_env OPENCODE_API_KEY "$OPENCODE_API_KEY"
          write_env OCI_VAULT_OCID "$OCI_VAULT_OCID"
          write_env GOOGLE_AI_API_KEY "$GOOGLE_AI_API_KEY"
          write_env NEXT_PUBLIC_GOOGLE_AI_API_KEY "$NEXT_PUBLIC_GOOGLE_AI_API_KEY"
          write_env GROQ_API_KEY "$GROQ_API_KEY"
          write_env GITHUB_MODELS_API_KEY "$GITHUB_MODELS_API_KEY"
          write_env GEMINI_API_KEY "$GEMINI_API_KEY"
          write_env ALICE_API_KEY "$ALICE_API_KEY"
          write_env N8N_API_KEY "$N8N_API_KEY"
          write_env N8N_WEBHOOK_URL "$N8N_WEBHOOK_URL"
          write_env CEREBRAS_API_KEY "$CEREBRAS_API_KEY"
          write_env OPENAI_API_KEY "$OPENAI_API_KEY"
          write_env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          write_env OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          write_env AGENT_API_URL "$AGENT_API_URL"
          write_env EXTENSION_ENCRYPTION_KEY "$EXTENSION_ENCRYPTION_KEY"
          write_env SECRETS_ENCRYPTION_KEY "$SECRETS_ENCRYPTION_KEY"
          write_env STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          write_env NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          write_env STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          write_env STRIPE_PRICE_PRO_ID "$STRIPE_PRICE_PRO_ID"
          write_env STRIPE_PRICE_PRO_YEARLY_ID "$STRIPE_PRICE_PRO_YEARLY_ID"
          write_env STRIPE_PRICE_TEAM_ID "$STRIPE_PRICE_TEAM_ID"
          write_env STRIPE_PRICE_TEAM_YEARLY_ID "$STRIPE_PRICE_TEAM_YEARLY_ID"
          write_env ADMIN_USER_IDS "$ADMIN_USER_IDS"
          write_env SPLAT_TRAINING_WEBHOOK "$SPLAT_TRAINING_WEBHOOK"
          write_env SPLAT_CALLBACK_SECRET "$SPLAT_CALLBACK_SECRET"
          write_env SIMPLE_RICK_API_KEY "$SIMPLE_RICK_API_KEY"
          write_env SPIRIT_GUIDE_API_KEY "$SPIRIT_GUIDE_API_KEY"
          write_env MONGODB_URI "$MONGODB_URI"

          chmod 600 "$ENV_FILE"
          echo "Production environment bundle prepared without printing secret values."

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install production environment on UpCloud
        shell: bash
        run: |
          set -euo pipefail
          scp "$RUNNER_TEMP/dreammakerhub.env" "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP:/tmp/dreammakerhub.env"

      - name: Deploy web image
        shell: bash
        run: |
          set -euo pipefail
          ssh "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" 'bash -s' <<'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/dreammakerhub.website

            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch origin Master
              git -C "$APP_DIR" reset --hard origin/Master
            else
              rm -rf "$APP_DIR"
              git clone --branch Master --single-branch https://github.com/AI-WonderLand1/dreammakerhub.website.git "$APP_DIR"
            fi

            install -m 600 /tmp/dreammakerhub.env "$APP_DIR/.env"
            rm -f /tmp/dreammakerhub.env
            cd "$APP_DIR"

            docker compose -f deploy/upcloud/docker-compose.web.yml pull
            docker compose -f deploy/upcloud/docker-compose.web.yml up -d --remove-orphans

            docker compose -f deploy/upcloud/docker-compose.web.yml ps
            docker exec dreammaker-web sh -c 'curl -fsS http://127.0.0.1:5000/health >/dev/null'
          REMOTE

      - name: Verify public homepage
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 https://dreammakerhub.website/ >/dev/null
          echo "DreamMakerHub homepage is responding from the production deployment."

      - name: Clean local environment bundle
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/dreammakerhub.env"
