name: Deploy Main Site to UpCloud VM

on:
  workflow_dispatch:
  push:
    branches:
      - Master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "engine/**"
      - "infra/**"
      - "packages/**"
      - "prisma/**"
      - "runners/**"
      - "types/**"
      - "tsconfig.base.json"
      - "deploy/upcloud/docker-compose.web.yml"
      - "deploy/upcloud/Caddyfile.web"
      - ".github/workflows/deploy-upcloud.yml"

permissions:
  contents: read

env:
  UPCLOUD_SERVER_IP: ${{ secrets.UPCLOUD_SERVER_IP }}
  UPCLOUD_SSH_USER: ${{ secrets.UPCLOUD_SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.UPLOAD_SSH_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy DreamMakerHub web to UpCloud VM
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPCLOUD_SERVER_IP" || { echo "Missing GitHub secret: UPCLOUD_SERVER_IP"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing GitHub secret: UPLOAD_SSH_KEY"; exit 1; }
          if [ -z "$UPCLOUD_SSH_USER" ]; then
            echo "UPCLOUD_SSH_USER is empty; workflow will use root."
          fi

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy web image
        shell: bash
        run: |
          set -euo pipefail
          SSH_USER="${UPCLOUD_SSH_USER:-root}"
          ssh "$SSH_USER@$UPCLOUD_SERVER_IP" 'bash -s' <<'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/dreammakerhub.website

            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch origin Master
              git -C "$APP_DIR" reset --hard origin/Master
            else
              rm -rf "$APP_DIR"
              git clone --branch Master --single-branch https://github.com/AI-WonderLand1/dreammakerhub.website.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env is missing. Create the production environment file on the VM; it will never be overwritten by this workflow." >&2
              exit 1
            fi

            docker compose -f deploy/upcloud/docker-compose.web.yml pull
            docker compose -f deploy/upcloud/docker-compose.web.yml up -d --remove-orphans

            docker compose -f deploy/upcloud/docker-compose.web.yml ps
            docker exec dreammaker-web sh -c 'curl -fsS http://127.0.0.1:5000/health >/dev/null'
          REMOTE

      - name: Verify public homepage
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 https://dreammakerhub.website/ >/dev/null
          echo "DreamMakerHub homepage is responding."
