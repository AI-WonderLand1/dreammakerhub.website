name: Deploy Main Site to UpCloud VM

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build & Push Web Image
    types:
      - completed

permissions:
  contents: read
  packages: read

env:
  # Host and SSH username are deployment configuration, not secrets.
  # GitHub repository variables can override these defaults.
  UPCLOUD_SERVER_IP: ${{ vars.UPCLOUD_SERVER_IP || '152.44.43.125' }}
  UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || 'ubuntu' }}
  # Prefer the correctly named UpCloud secret while retaining the historical
  # UPLOAD_SSH_KEY spelling so existing repository configuration keeps working.
  SSH_PRIVATE_KEY: ${{ secrets.UPCLOUD_SSH_KEY || secrets.UPLOAD_SSH_KEY }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'Master')
    runs-on: ubuntu-latest
    name: Deploy DreamMakerHub web to UpCloud VM

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7
        with:
          ref: Master

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPCLOUD_SERVER_IP" || { echo "Missing UpCloud server IP"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing GitHub Actions SSH secret: set UPCLOUD_SSH_KEY (preferred) or legacy UPLOAD_SSH_KEY"; exit 1; }
          echo "Deploy target: ${UPCLOUD_SSH_USER}@${UPCLOUD_SERVER_IP}"

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy web image
        shell: bash
        run: |
          set -euo pipefail
          ssh "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" 'bash -s' <<'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/dreammakerhub.website

            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch origin Master
              git -C "$APP_DIR" reset --hard origin/Master
            else
              rm -rf "$APP_DIR"
              git clone --branch Master --single-branch https://github.com/AI-WonderLand1/dreammakerhub.website.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env is missing. Create the production environment file on the VM; it will never be overwritten by this workflow." >&2
              exit 1
            fi

            docker compose -f deploy/upcloud/docker-compose.web.yml pull
            docker compose -f deploy/upcloud/docker-compose.web.yml up -d --remove-orphans

            docker compose -f deploy/upcloud/docker-compose.web.yml ps
            docker exec dreammaker-web sh -c 'curl -fsS http://127.0.0.1:5000/health >/dev/null'
          REMOTE

      - name: Verify public homepage
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 https://dreammakerhub.website/ >/dev/null
          echo "DreamMakerHub homepage is responding from the production deployment."
