name: Deploy Main Site to UpCloud VM

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build & Push Web Image
    types:
      - completed

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-upcloud-production
  cancel-in-progress: true

env:
  UPCLOUD_SERVER_IP: ${{ vars.UPCLOUD_SERVER_IP || '152.44.43.125' }}
  UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || 'root' }}
  SSH_PRIVATE_KEY: ${{ secrets.UPCLOUD_SSH_KEY || secrets.UPLOAD_SSH_KEY }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'Master')
    runs-on: ubuntu-latest
    name: Deploy DreamMakerHub web to UpCloud VM

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7
        with:
          ref: Master

      - name: Validate required production configuration
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$UPCLOUD_SERVER_IP" || { echo "Missing UpCloud server IP"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing UPCLOUD_SSH_KEY/UPLOAD_SSH_KEY"; exit 1; }

          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL; do
            test -n "${!name:-}" || { echo "Missing required GitHub Actions value: $name"; exit 1; }
          done

          case "$NEXT_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "NEXT_PUBLIC_SUPABASE_URL is not a valid Supabase project URL"; exit 1 ;;
          esac

          echo "Required production configuration is available."

      - name: Build environment patch from GitHub Actions
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          PATCH_FILE="$RUNNER_TEMP/dreammakerhub.env.patch"
          : > "$PATCH_FILE"

          write_env() {
            local key="$1"
            local value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Value for $key contains a newline; refusing unsafe env serialization."
              exit 1
            fi
            printf '%s=%s\n' "$key" "$value" >> "$PATCH_FILE"
          }

          write_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          write_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          write_env SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          write_env DATABASE_URL "$DATABASE_URL"
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            write_env OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          fi

          chmod 600 "$PATCH_FILE"
          echo "Environment patch prepared without printing secret values."

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy environment patch to UpCloud
        shell: bash
        run: |
          set -euo pipefail
          scp "$RUNNER_TEMP/dreammakerhub.env.patch" "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP:/tmp/dreammakerhub.env.patch"

      - name: Deploy latest web image
        shell: bash
        run: |
          set -euo pipefail
          ssh "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" 'bash -s' <<'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/dreammakerhub.website
            COMPOSE=deploy/upcloud/docker-compose.yml

            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch origin Master
              git -C "$APP_DIR" reset --hard origin/Master
            else
              rm -rf "$APP_DIR"
              git clone --branch Master --single-branch https://github.com/AI-WonderLand1/dreammakerhub.website.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            umask 077

            # Preserve the environment from the currently running production
            # container when no persistent root env file exists yet.
            if [ ! -s .env ] && docker inspect dreammaker-web >/dev/null 2>&1; then
              docker inspect dreammaker-web \
                --format '{{range .Config.Env}}{{println .}}{{end}}' \
                | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' > .env
            fi
            touch .env
            chmod 600 .env

            # Merge the GitHub-managed production values without printing them.
            while IFS='=' read -r key value; do
              [ -n "$key" ] || continue
              tmp="$(mktemp)"
              grep -v "^${key}=" .env > "$tmp" || true
              printf '%s=%s\n' "$key" "$value" >> "$tmp"
              mv "$tmp" .env
              chmod 600 .env
            done < /tmp/dreammakerhub.env.patch
            rm -f /tmp/dreammakerhub.env.patch

            docker compose --env-file .env -f "$COMPOSE" pull web
            docker compose --env-file .env -f "$COMPOSE" up -d --no-deps --force-recreate web

            docker compose --env-file .env -f "$COMPOSE" ps web
            docker exec dreammaker-web sh -c 'curl -fsS --retry 10 --retry-delay 2 http://127.0.0.1:5000/health >/dev/null'
            docker exec dreammaker-web sh -c 'curl -fsS --retry 10 --retry-delay 2 http://127.0.0.1:5000/api/config/supabase >/dev/null'
          REMOTE

      - name: Verify public deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 8 --retry-delay 3 https://dreammakerhub.website/ >/dev/null
          curl --fail --show-error --silent --retry 8 --retry-delay 3 https://dreammakerhub.website/api/config/supabase >/dev/null
          echo "Production homepage and Supabase configuration route are healthy."

      - name: Clean runner environment patch
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/dreammakerhub.env.patch"
