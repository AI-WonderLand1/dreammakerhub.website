name: HostBrr web deployment preflight

on:
  pull_request:
    paths:
      - "deploy/hostbrr/**"
      - ".github/workflows/hostbrr-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manual deploy script syntax
        run: |
          bash -n deploy/hostbrr/deploy.sh
          bash -n deploy/hostbrr/update-web.sh
      - name: Validate private and optional public Docker Compose plans
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/hostbrr
          trap 'rm -f runtime.env deployment.env' EXIT
          # CI-only fake values, never production secrets.
          printf '%s\n' \
            'NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co' \
            'NEXT_PUBLIC_SUPABASE_ANON_KEY=example-public-key' \
            'SUPABASE_SERVICE_ROLE_KEY=example-do-not-use' \
            'DATABASE_URL=postgresql://invalid:invalid@localhost:5432/invalid' > runtime.env
          printf '%s\n' \
            'WEB_IMAGE=ghcr.io/ai-wonderland1/dreammakerhub-website:0123456789abcdef0123456789abcdef01234567' > deployment.env
          docker compose --env-file deployment.env -f compose.yaml config --quiet
          docker compose --env-file deployment.env -f compose.yaml -f compose.public.yaml config --quiet
          grep -Fq '"127.0.0.1:5001:5000"' compose.yaml
          for flag in BILLABLE_OPERATIONS_ENABLED CODER_WORKSPACE_CREATION_ENABLED CODER_CUSTOMER_PROVISIONING_ENABLED FREE_BUILDER_AI_ENABLED; do
            grep -Eq "^[[:space:]]+$flag: \"false\"$" compose.yaml
          done
          echo 'HostBrr config parse and safety invariants passed.'
