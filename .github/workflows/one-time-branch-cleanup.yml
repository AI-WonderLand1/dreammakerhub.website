name: One-time branch cleanup

on:
  push:
    branches:
      - Master
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  prune-legacy-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve old branch tips as tags and delete branch refs
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^Master$' \
              | sort -u
          )

          echo "Found ${#branches[@]} non-default branches to clean."

          for branch in "${branches[@]}"; do
            remote_ref="refs/remotes/origin/${branch}"
            sha="$(git rev-parse "${remote_ref}")"
            tag="legacy-branch-backup/${branch}"

            echo "Preserving ${branch} at ${sha} as tag ${tag}"
            git tag -f "${tag}" "${sha}"
            git push origin "refs/tags/${tag}" --force

            echo "Deleting branch ${branch}"
            git push origin --delete "${branch}" || true
          done

          echo "Branch cleanup complete. Master was preserved."
