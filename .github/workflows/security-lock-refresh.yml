name: Refresh security lockfiles
# finalize verified subset
# exact-parent override retry

on:
  push:
    branches:
      - fix/dependabot-security-2026-09-01
    paths:
      - ".github/workflows/security-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: fix/dependabot-security-2026-09-01

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            my-agent/package-lock.json
            spatial-platform/apps/web/package-lock.json
            spatial-platform/apps/api/package-lock.json

      - name: Upgrade npm for workspace override fixes
        run: |
          npm install -g npm@12.0.2
          npm config set allow-remote all
          npm config set allow-git all
          npm --version

      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh my-agent lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix my-agent

      - name: Refresh spatial web lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix spatial-platform/apps/web

      - name: Refresh spatial API lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix spatial-platform/apps/api

      - name: Verify patched versions
        run: |
          node <<'NODE'
          const fs = require("fs");

          function versions(path, names) {
            const lock = JSON.parse(fs.readFileSync(path, "utf8"));
            const out = {};
            for (const name of names) out[name] = [];
            for (const [pkgPath, pkg] of Object.entries(lock.packages || {})) {
              for (const name of names) {
                if (pkgPath === `node_modules/${name}` || pkgPath.endsWith(`/node_modules/${name}`)) {
                  out[name].push(pkg.version);
                }
              }
            }
            return out;
          }

          const root = versions("package-lock.json", ["mysql2", "decode-uri-component", "uuid", "nanoid"]);
          const agent = versions("my-agent/package-lock.json", ["mysql2", "mariadb", "uuid"]);
          const spatialWeb = versions("spatial-platform/apps/web/package-lock.json", ["nanoid"]);
          const spatialApi = versions("spatial-platform/apps/api/package-lock.json", ["decode-uri-component"]);

          console.log({ root, agent, spatialWeb, spatialApi });

          if (!root.mysql2.every(v => v === "3.22.0")) throw new Error("root mysql2 not pinned to 3.22.0");
          console.log("Residual root advisories intentionally not forced:", {
            decodeUriComponent: root["decode-uri-component"],
            uuid: root.uuid,
          });

          if (!agent.mysql2.every(v => v === "3.22.0")) throw new Error("my-agent mysql2 not patched");
          if (!agent.mariadb.every(v => v === "3.5.3")) throw new Error("my-agent mariadb not patched");
          if (!spatialWeb.nanoid.every(v => v === "3.3.18")) throw new Error("spatial web nanoid not patched");
          if (!spatialApi["decode-uri-component"].every(v => v === "0.5.0")) throw new Error("spatial API decode-uri-component not patched");
          NODE

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json my-agent/package-lock.json spatial-platform/apps/web/package-lock.json spatial-platform/apps/api/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "security: refresh patched dependency lockfiles [skip ci]"
          git push origin HEAD:fix/dependabot-security-2026-09-01
