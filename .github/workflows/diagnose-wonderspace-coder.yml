# Read-only Coder connectivity diagnostic rerun for WonderSpace IDE.
name: Diagnose WonderSpace Coder (read-only)

on:
  push:
    branches:
      - diagnose/wonderspace-coder-20260917
    paths:
      - .github/workflows/diagnose-wonderspace-coder.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPCLOUD_SERVER_IP: ${{ vars.UPCLOUD_SERVER_IP || '152.44.43.125' }}
      UPCLOUD_SSH_USER: ${{ vars.UPCLOUD_SSH_USER || 'root' }}
      SSH_PRIVATE_KEY: ${{ secrets.UPCLOUD_SSH_KEY || secrets.UPLOAD_SSH_KEY }}
    steps:
      - name: Check public Coder DNS and HTTP response headers
        shell: bash
        run: |
          set -euo pipefail
          if getent ahostsv4 coder.dreammakerhub.website >/dev/null; then
            echo 'Coder public DNS: resolves'
          else
            echo 'Coder public DNS: does not resolve'
          fi
          headers="$(mktemp)"
          status="$(curl --silent --show-error --max-time 12 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' https://coder.dreammakerhub.website/api/v2/buildinfo || true)"
          echo "Coder public buildinfo HTTP: ${status:-000}"
          grep -Ei '^(server|cf-ray|cf-mitigated|x-coder-build-version):' "$headers" || true
          rm -f "$headers"

      - name: Compare configured and public Coder connections from the running web container
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'UpCloud SSH credential missing in GitHub Actions'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$UPCLOUD_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$UPCLOUD_SSH_USER@$UPCLOUD_SERVER_IP" 'sudo -n bash -s' <<'REMOTE'
            set -euo pipefail
            for service in coder coder-db dreammaker-web; do
              state="$(docker inspect --format '{{.State.Status}}' "$service" 2>/dev/null || true)"
              echo "Docker $service: ${state:-absent}"
            done
            if docker inspect dreammaker-web >/dev/null 2>&1; then
              docker exec dreammaker-web sh -c '
                for key in CODER_API_URL CODER_ACCESS_URL CODER_API_TOKEN; do
                  if [ -n "$(printenv "$key")" ]; then echo "$key: present"; else echo "$key: missing"; fi
                done
              '
              docker exec dreammaker-web node -e '
                (async () => {
                  const raw = process.env.CODER_API_URL;
                  if (!raw) return console.log("Coder API URL: missing");
                  let configured;
                  try {
                    configured = new URL(raw);
                    console.log(`Configured Coder protocol: ${configured.protocol}`);
                    console.log(`Configured Coder hostname: ${configured.hostname}`);
                    console.log(`Configured Coder URL has a path: ${configured.pathname !== "/" && configured.pathname !== ""}`);
                  } catch (_) {
                    return console.log("Coder API URL: invalid URL");
                  }
                  const dns = require("node:dns").promises;
                  for (const [name, target] of [
                    ["configured", `${raw.replace(/\/$/, "")}/api/v2/buildinfo`],
                    ["public", "https://coder.dreammakerhub.website/api/v2/buildinfo"],
                  ]) {
                    const hostname = new URL(target).hostname;
                    try {
                      await dns.lookup(hostname);
                      console.log(`${name} Coder DNS from web: resolves`);
                    } catch (error) {
                      console.log(`${name} Coder DNS from web: ${error?.code || "error"}`);
                    }
                    try {
                      const response = await fetch(target, {
                        signal: AbortSignal.timeout(7000),
                        headers: { "Coder-Session-Token": process.env.CODER_API_TOKEN || "" },
                      });
                      console.log(`${name} Coder buildinfo HTTP from web: ${response.status}`);
                      console.log(`${name} Coder response server: ${response.headers.get("server") || "not-provided"}`);
                    } catch (error) {
                      console.log(`${name} Coder request failed: ${error?.name || "unknown"}`);
                    }
                  }
                })();
              ' || echo 'Unable to run network probe from web container'
            fi
            # Authenticated metadata only: never prints the token, IDs, or template names.
            if docker inspect dreammaker-web >/dev/null 2>&1; then
              docker exec dreammaker-web node -e '
                (async () => {
                  const raw = process.env.CODER_API_URL;
                  const token = process.env.CODER_API_TOKEN;
                  if (!raw || !token) return console.log("Coder authenticated checks: configuration missing");
                  const origin = raw.replace(/\/$/, "");
                  const get = (path) => fetch(`${origin}${path}`, {
                    headers: { "Coder-Session-Token": token, Accept: "application/json" },
                    redirect: "error",
                    signal: AbortSignal.timeout(7000),
                  });
                  try {
                    const identity = await get("/api/v2/users/me");
                    console.log(`Coder token identity HTTP from web: ${identity.status}`);
                    const templatesResponse = await get("/api/v2/templates");
                    console.log(`Coder template list HTTP from web: ${templatesResponse.status}`);
                    if (!templatesResponse.ok) return;
                    const templates = await templatesResponse.json();
                    if (!Array.isArray(templates)) return console.log("Coder template list shape: invalid");
                    const override = process.env.CODER_IDE_TEMPLATE_NAME;
                    const expectedNames = override ? [override] : ["wonderspace-ide", "kubernetes-mvp", "kubernetes"];
                    const template = expectedNames
                      .map((name) => templates.find((item) => item && item.name === name))
                      .find((item) => item && item.id && item.active_version_id);
                    console.log(`Expected Coder template present: ${Boolean(template)}`);
                    if (!template) return;
                    const parametersResponse = await get(`/api/v2/templateversions/${encodeURIComponent(template.active_version_id)}/rich-parameters`);
                    console.log(`Expected template parameters HTTP from web: ${parametersResponse.status}`);
                    if (!parametersResponse.ok) return;
                    const parameters = await parametersResponse.json();
                    if (!Array.isArray(parameters)) return console.log("Expected template parameter shape: invalid");
                    const hasChoices = (name) => Boolean(parameters.find((item) => item && item.name === name && Array.isArray(item.options) && item.options.length));
                    console.log(`Expected template CPU choices available: ${hasChoices("cpu")}`);
                    console.log(`Expected template memory choices available: ${hasChoices("memory")}`);
                    const imageParameter = parameters.find((item) => item && item.name === "ide_image");
                    const approvedProfile = Array.isArray(imageParameter?.options) && imageParameter.options.some((option) =>
                      option && (option.value === "linux" || option.value === "node"));
                    console.log(`Expected template image selector present: ${Boolean(imageParameter)}`);
                    console.log(`Expected template approved image profile available: ${approvedProfile}`);
                    try {
                      const byName = (name) => parameters.find((parameter) => parameter.name === name);
                      const choices = (name) => (byName(name)?.options || [])
                        .map((option) => ({ label: option.name || option.value, value: option.value }));
                      const cpu = choices("cpu");
                      const memory = choices("memory");
                      if (!cpu.length || !memory.length) throw new Error("missing_required_choices");
                      const images = choices("ide_image").filter((choice) => choice.value === "linux" || choice.value === "node");
                      if (byName("ide_image") && !images.length) throw new Error("unapproved_ide_image");
                      const reconstructed = {
                        templateId: template.id,
                        templateName: template.name,
                        cpu,
                        memory,
                        images,
                        regions: choices("region"),
                        repositorySupported: Boolean(byName("repo_url") && byName("repo_branch")),
                        sshSupported: Boolean(byName("ssh_public_key")),
                        diskSupported: Boolean(byName("home_disk_size")),
                      };
                      console.log(`Website launch-config reconstruction: ${reconstructed.templateId && reconstructed.templateName ? "succeeded" : "invalid"}`);
                    } catch (error) {
                      console.log(`Website launch-config reconstruction: failed:${error?.message || error?.name || "unknown"}`);
                    }
                  } catch (error) {
                    console.log(`Coder authenticated checks failed: ${error?.name || "unknown"}`);
                  }
                })();
              ' || echo 'Unable to run authenticated Coder checks from web container'
            fi
                        if docker inspect dreammaker-web >/dev/null 2>&1; then
              docker exec dreammaker-web node -e '
                (async () => {
                  try {
                    const response = await fetch("http://127.0.0.1:5000/api/public/service-status", {
                      signal: AbortSignal.timeout(7000),
                    });
                    const body = await response.json().catch(() => null);
                    const ide = body?.services?.find?.((service) => service?.id === "ide");
                    console.log(`Local website Coder status HTTP: ${response.status}`);
                    console.log(`Local website Coder status: ${ide?.status || "invalid"}`);
                  } catch (error) {
                    console.log(`Local website Coder status failed: ${error?.name || "unknown"}`);
                  }
                })();
              ' || echo 'Unable to read local website Coder status'
              docker exec dreammaker-web sh -c 'ps -eo pid=,ppid=,comm=,args= | grep -E "[n]ode|[n]ext" || true'
              docker exec dreammaker-web node -e '
                const fs = require("node:fs");
                const pid = fs.readdirSync("/proc").find((entry) => {
                  if (!/^\\d+$/.test(entry)) return false;
                  try {
                    const command = fs.readFileSync(`/proc/${entry}/cmdline`, "utf8");
                    return command.includes("next-server");
                  } catch { return false; }
                });
                if (!pid) {
                  console.log("Next server process environment: not found");
                  process.exit(0);
                }
                const entries = fs.readFileSync(`/proc/${pid}/environ`, "utf8").split("\\0");
                const values = Object.fromEntries(entries.filter(Boolean).map((entry) => {
                  const index = entry.indexOf("=");
                  return [entry.slice(0, index), entry.slice(index + 1)];
                }));
                console.log("Next server process environment: found");
                const raw = values.CODER_API_URL;
                console.log("Next server CODER_API_URL: " + (raw ? "present" : "missing"));
                console.log("Next server CODER_API_TOKEN: " + (values.CODER_API_TOKEN ? "present" : "missing"));
                if (raw) {
                  try {
                    const parsed = new URL(raw);
                    console.log("Next server Coder protocol: " + parsed.protocol);
                    console.log("Next server Coder hostname: " + parsed.hostname);
                    console.log("Next server Coder URL has a path: " + (parsed.pathname !== "/" && parsed.pathname !== ""));
                  } catch {
                    console.log("Next server Coder URL: invalid");
                  }
                }
              '
              docker exec dreammaker-web node -e '
                const fs = require("node:fs");
                const entries = fs.readFileSync("/proc/1/environ", "utf8").split("\\0");
                const values = Object.fromEntries(entries.filter(Boolean).map((entry) => {
                  const index = entry.indexOf("=");
                  return [entry.slice(0, index), entry.slice(index + 1)];
                }));
                const raw = values.CODER_API_URL;
                for (const key of [
                  "CODER_API_URL",
                  "CODER_ACCESS_URL",
                  "CODER_API_TOKEN",
                  "CODER_WORKSPACE_CREATION_ENABLED",
                  "NEXT_PUBLIC_SUPABASE_URL",
                  "SUPABASE_SERVICE_ROLE_KEY",
                  "NODE_ENV",
                  "PORT",
                  "GITHUB_SHA",
                ]) {
                  console.log(`PID 1 ${key}: ${values[key] ? "present" : "missing"}`);
                }
                if (raw) {
                  try {
                    const parsed = new URL(raw);
                    console.log("PID 1 Coder protocol: " + parsed.protocol);
                    console.log("PID 1 Coder hostname: " + parsed.hostname);
                    console.log("PID 1 Coder URL has a path: " + (parsed.pathname !== "/" && parsed.pathname !== ""));
                  } catch {
                    console.log("PID 1 Coder URL: invalid");
                  }
                }
              '
                            docker exec dreammaker-web node -e '
                const fs = require("node:fs");
                const root = "/app/.next/server";
                const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
                  const path = dir + "/" + entry.name;
                  return entry.isDirectory() ? walk(path) : [path];
                });
                const file = walk(root).find((path) => path.endsWith(".js") && fs.readFileSync(path, "utf8").includes("kubernetes-mvp"));
                if (!file) {
                  console.log("Compiled Coder configuration excerpt: not found");
                } else {
                  const code = fs.readFileSync(file, "utf8");
                  const index = code.indexOf("kubernetes-mvp");
                  console.log("Compiled Coder configuration excerpt: " + code.slice(Math.max(0, index - 900), index + 1300).replace(/\\s+/g, " "));
                }
              '
                            docker exec dreammaker-web sh -c '
                if [ -n "$GITHUB_SHA" ]; then echo "Web image build SHA: present"; else echo "Web image build SHA: missing"; fi
                if grep -R -F -q "kubernetes-mvp" /app/.next/server 2>/dev/null; then
                  echo "Web bundle recognizes Kubernetes template fallback: yes"
                else
                  echo "Web bundle recognizes Kubernetes template fallback: no"
                fi
              '
            fi
                        if command -v kubectl >/dev/null 2>&1; then
              if kubectl --request-timeout=7s -n coder get deployment coder >/dev/null 2>&1; then
                kubectl --request-timeout=7s -n coder get deployments coder coder-db -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,DESIRED:.spec.replicas' 2>&1 || true
              else
                echo 'Kubernetes coder deployment: unavailable from this server/context'
              fi
            else
              echo 'kubectl: not installed on main web server'
            fi
          REMOTE

# Re-run requested 2026-09-22; this workflow only reports sanitized connection status.
