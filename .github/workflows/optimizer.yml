name: Build & Push Optimizer

on:
  push:
    branches:
      - main
    paths:
      - 'packages/optimizer/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to OCI Registry
        uses: docker/login-action@v4
        with:
          registry: ord.ocir.io
          username: ${{ secrets.OCI_REGISTRY_USER }}
          password: ${{ secrets.OCI_REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: packages/optimizer
          file: packages/optimizer/Dockerfile
          push: true
          tags: ord.ocir.io/axgejcaos4uw/ai-wonderland/optimizer:latest
