name: Validate first-party CodeQL fixes

on:
  push:
    branches:
      - fix/codeql-first-party-high-2026-09-01
    paths:
      - ".github/workflows/codeql-security-validate.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: fix/codeql-first-party-high-2026-09-01

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check changed web files
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p apps/web/tsconfig.json > /tmp/tsc.log 2>&1
          tsc_status=$?
          set -e

          cat /tmp/tsc.log

          changed_files=(
            "apps/web/lib/security/sanitize-html.server.ts"
            "apps/web/lib/security/api-key-hash.server.ts"
            "apps/web/lib/builder/html-parser.ts"
            "apps/web/lib/wonder-build/template-library/components/TemplateThumbnail.tsx"
            "apps/web/app/(preview)/preview/[projectId]/page.tsx"
            "apps/web/app/api/builder/ai/route.ts"
            "apps/web/app/api/auth/register/route.ts"
            "apps/web/app/api/webhooks/incoming/[projectId]/route.ts"
          )

          introduced_error=0
          for file in "${changed_files[@]}"; do
            if grep -F "${file}(" /tmp/tsc.log >/dev/null; then
              echo "TypeScript error in changed file: ${file}"
              introduced_error=1
            fi
          done

          if [ "${introduced_error}" -ne 0 ]; then
            exit 1
          fi

          if [ "${tsc_status}" -ne 0 ]; then
            echo "Baseline TypeScript errors remain outside this security patch."
          fi

      - name: Syntax-check Coder client
        run: node --check packages/coder-workspace/src/coder-client.js

      - name: Compile-check repo analyzer
        run: python -m py_compile agent/core/repo_analyzer.py

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "security: refresh DOMPurify lockfile [skip ci]"
          git push origin HEAD:fix/codeql-first-party-high-2026-09-01
